definitions:
  domain.AccessMenu:
    properties:
      icon:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      path:
        type: string
    type: object
  domain.CashShift:
    properties:
      closed_at:
        type: string
      closing_cash:
        type: number
      expected_cash:
        type: number
      id:
        type: string
      notes:
        type: string
      opened_at:
        type: string
      opening_cash:
        type: number
      status:
        allOf:
        - $ref: '#/definitions/domain.CashShiftStatus'
        description: OPEN, CLOSED
      total_cash_sales:
        type: number
      total_debit_sales:
        type: number
      total_qris_sales:
        type: number
      user_id:
        type: string
    type: object
  domain.CashShiftStatus:
    enum:
    - OPEN
    - CLOSED
    type: string
    x-enum-varnames:
    - CashShiftStatusOpen
    - CashShiftStatusClosed
  domain.OCRItem:
    properties:
      name:
        type: string
      price:
        type: number
      quantity:
        type: integer
    type: object
  domain.Order:
    properties:
      created_at:
        type: string
      id:
        type: string
      idempotency_key:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/domain.OrderStatus'
        description: PENDING, PREPARING, READY, SERVED, COMPLETED, CANCELLED, REFUNDED
      total_amount:
        type: number
      transaction_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.OrderItem:
    properties:
      id:
        type: string
      name:
        type: string
      order_id:
        type: string
      product_id:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      unit_price:
        type: number
    type: object
  domain.OrderPayment:
    properties:
      amount:
        type: number
      created_at:
        type: string
      gateway:
        $ref: '#/definitions/domain.PaymentGateway'
      gateway_transaction_id:
        type: string
      id:
        type: string
      order_id:
        type: string
      payment_method:
        $ref: '#/definitions/domain.PaymentMethod'
      raw_response:
        type: string
      snap_redirect_url:
        type: string
      snap_token:
        type: string
      status:
        $ref: '#/definitions/domain.PaymentStatus'
      updated_at:
        type: string
    type: object
  domain.OrderStatus:
    enum:
    - UNPAID
    - PENDING
    - PREPARING
    - READY
    - SERVED
    - COMPLETED
    - CANCELLED
    - EXPIRED
    - REFUNDED
    - PENDING
    - COMPLETED
    - CANCELLED
    - REFUNDED
    type: string
    x-enum-varnames:
    - OrderStatusUnpaid
    - OrderStatusPending
    - OrderStatusPreparing
    - OrderStatusReady
    - OrderStatusServed
    - OrderStatusCompleted
    - OrderStatusCancelled
    - OrderStatusExpired
    - OrderStatusRefunded
    - StatusPending
    - StatusCompleted
    - StatusCancelled
    - StatusRefunded
  domain.PaymentGateway:
    enum:
    - MIDTRANS
    - CASH
    type: string
    x-enum-varnames:
    - GatewayMidtrans
    - GatewayCash
  domain.PaymentMethod:
    enum:
    - CASH
    - MIDTRANS
    - QRIS
    - DEBIT
    type: string
    x-enum-varnames:
    - PaymentMethodCash
    - PaymentMethodMidtrans
    - PaymentMethodQris
    - PaymentMethodDebit
  domain.PaymentStatus:
    enum:
    - PENDING
    - SUCCESS
    - FAILED
    - EXPIRED
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusSuccess
    - PaymentStatusFailed
    - PaymentStatusExpired
  domain.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      stock_quantity:
        type: integer
      updated_at:
        type: string
    type: object
  domain.ReceiptAudit:
    properties:
      created_at:
        type: string
      id:
        type: string
      merchant_name:
        type: string
      raw_ocr_json:
        $ref: '#/definitions/domain.ReceiptOCRResult'
      receipt_date:
        type: string
      total_amount:
        type: number
    type: object
  domain.ReceiptOCRResult:
    properties:
      date:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.OCRItem'
        type: array
      merchant_name:
        type: string
      total_amount:
        type: number
    type: object
  domain.UserRole:
    enum:
    - ADMIN
    - CASHIER
    - KITCHEN
    - WAREHOUSE
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleCashier
    - RoleKitchen
    - RoleWarehouse
  dto.CheckoutItemRequest:
    properties:
      quantity:
        type: integer
      sku:
        type: string
    required:
    - quantity
    - sku
    type: object
  dto.CheckoutRequest:
    properties:
      idempotency_key:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.CheckoutItemRequest'
        type: array
      payment_method:
        $ref: '#/definitions/domain.PaymentMethod'
    required:
    - idempotency_key
    - items
    type: object
  dto.CloseCashShiftRequest:
    properties:
      closing_cash:
        minimum: 0
        type: number
      notes:
        type: string
    required:
    - closing_cash
    type: object
  dto.CloseCashShiftResponse:
    properties:
      closing_cash:
        type: number
      difference:
        type: number
      expected_cash:
        type: number
      message:
        type: string
      opening_cash:
        type: number
      total_sales:
        type: number
    type: object
  dto.CreatePaymentChargeRequest:
    properties:
      amount:
        type: number
      order_id:
        type: string
      payment_method:
        $ref: '#/definitions/domain.PaymentMethod'
    required:
    - amount
    - order_id
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.MidtransWebhookRequest:
    properties:
      gross_amount:
        type: string
      order_id:
        type: string
      signature_key:
        type: string
      status_code:
        type: string
      transaction_status:
        type: string
    required:
    - order_id
    type: object
  dto.OpenCashShiftRequest:
    properties:
      notes:
        type: string
      opening_cash:
        minimum: 0
        type: number
    required:
    - opening_cash
    type: object
  dto.OpenCashShiftResponse:
    properties:
      message:
        type: string
      shift_id:
        type: string
    type: object
  dto.UpdateOrderStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/domain.OrderStatus'
        enum:
        - PENDING
        - PREPARING
        - READY
        - SERVED
        - COMPLETED
        - CANCELLED
    required:
    - status
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      updated_at:
        type: string
      username:
        type: string
    type: object
  inbound.SyncStatusResponse:
    properties:
      is_online:
        type: boolean
      last_synced_at:
        type: string
      pending_orders:
        type: integer
      pending_payments:
        type: integer
      pending_shifts:
        type: integer
    type: object
info:
  contact: {}
paths:
  /access-menus:
    get:
      description: Get list of application menus
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AccessMenu'
            type: array
      summary: Get access menus
      tags:
      - AccessMenus
  /access-menus/roles:
    get:
      description: Get role-based menu access configurations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get role access mappings
      tags:
      - AccessMenus
    put:
      consumes:
      - application/json
      description: Update permission for a specific role and menu key (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Update role menu access
      tags:
      - AccessMenus
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
      summary: User login
      tags:
      - Auth
  /auth/me:
    get:
      description: Get authenticated user profile (Me)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
      summary: Get current user profile
      tags:
      - Auth
  /cash-shifts/close:
    post:
      consumes:
      - application/json
      description: Close active cashier shift (tutup kasir)
      parameters:
      - description: Closing cash amount and notes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CloseCashShiftRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CloseCashShiftResponse'
      summary: Close cash shift
      tags:
      - CashShifts
  /cash-shifts/current:
    get:
      description: Get active open cash shift for logged-in cashier
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CashShift'
      summary: Get current cash shift
      tags:
      - CashShifts
  /cash-shifts/open:
    post:
      consumes:
      - application/json
      description: Open a new cashier shift (buka kasir)
      parameters:
      - description: Opening cash amount and notes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OpenCashShiftRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.OpenCashShiftResponse'
      summary: Open cash shift
      tags:
      - CashShifts
  /finance/profit-loss:
    get:
      description: Calculate total revenue, profit, and loss
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get profit & loss summary
      tags:
      - Finance
  /kitchen/orders:
    get:
      description: Get list of active orders for kitchen display system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
      summary: List active kitchen orders
      tags:
      - Kitchen
  /kitchen/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update order status (preparing, ready, served, completed)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: New order status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Update order status
      tags:
      - Kitchen
  /orders/checkout:
    post:
      consumes:
      - application/json
      description: Process order checkout with idempotency key and stock deduction
      parameters:
      - description: Checkout items and details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Order'
      summary: Checkout order
      tags:
      - Orders
  /orders/history:
    get:
      description: Get historical orders for financial reporting
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
      summary: Get order history
      tags:
      - Finance
  /payments/charge:
    post:
      consumes:
      - application/json
      description: Initiate payment charge (Midtrans QRIS / Snap)
      parameters:
      - description: Payment charge details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePaymentChargeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.OrderPayment'
      summary: Create payment charge
      tags:
      - Payments
  /payments/order/{order_id}:
    get:
      description: Get payment status and details by order ID
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.OrderPayment'
      summary: Get payment by order ID
      tags:
      - Payments
  /payments/webhook:
    post:
      consumes:
      - application/json
      description: Handle asynchronous payment status notification from Midtrans
      parameters:
      - description: Webhook payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MidtransWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Midtrans payment webhook
      tags:
      - Payments
  /products:
    get:
      description: Get all products available in inventory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Product'
            type: array
      summary: List all products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Create a new product in inventory (Admin/Warehouse only)
      parameters:
      - description: Product details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Product'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Product'
      summary: Create a new product
      tags:
      - Products
  /products/{sku}:
    get:
      description: Get specific product details by SKU
      parameters:
      - description: Product SKU
        in: path
        name: sku
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Product'
      summary: Get product by SKU
      tags:
      - Products
  /receipts/audits:
    get:
      description: Get audit logs of scanned receipts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ReceiptAudit'
            type: array
      summary: List receipt audits
      tags:
      - Receipts
  /receipts/scan:
    post:
      consumes:
      - multipart/form-data
      description: Extract item details from receipt image using AI vision client
      parameters:
      - description: Receipt Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ReceiptAudit'
      summary: Scan receipt image (AI Vision)
      tags:
      - Receipts
  /sync/status:
    get:
      description: Check offline sync status and pending records count
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inbound.SyncStatusResponse'
      summary: Get sync status
      tags:
      - Sync
  /sync/trigger:
    post:
      consumes:
      - application/json
      description: Trigger data synchronization from local SQLite to central PostgreSQL
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Trigger synchronization
      tags:
      - Sync
swagger: "2.0"
